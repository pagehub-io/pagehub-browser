services:
  pagehub-browser:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local-dev}
    image: pagehub-browser:local
    ports:
      - "4010:4010"
    env_file:
      - .env
    environment:
      # .env keeps ENV=development for local dev; any deployed compose MUST override this.
      ENV: ${ENV:-development}
      # Stamped by `make up`. Set here as well as the build arg because .env also
      # sets GIT_COMMIT, and an env_file value overrides the image's ENV.
      GIT_COMMIT: ${GIT_COMMIT:-local-dev}
    # So `navigate` to http://host.docker.internal:<port>/ reaches a target frontend running
    # on the host (paired with BROWSER_ALLOW_PRIVATE_HOSTS=true in .env — dev only).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Chromium needs more shared memory than the default 64MB; --disable-dev-shm-usage also covers us.
    shm_size: "1gb"
    restart: unless-stopped
